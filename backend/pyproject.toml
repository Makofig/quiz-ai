[project]
name = "backend"
version = "0.1.0"
description = "AI-powered quiz platform backend"
package-mode = false
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "python-multipart>=0.0.18",
    "aiofiles>=24.1.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "markdown-it-py>=3.0.0",
    "ollama>=0.3.0",
    "httpx>=0.27.2",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
